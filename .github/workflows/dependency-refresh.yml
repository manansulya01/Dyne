name: Refresh vulnerable dependencies

on:
  push:
    branches:
      - feature/youtube-curation-fast-material-library
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/youtube-curation-fast-material-library
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Save original dependency manifests
        run: |
          cp package.json /tmp/dyne-package.before.json
          cp package-lock.json /tmp/dyne-lock.before.json
      - name: Upgrade directly affected toolchain packages
        run: |
          npm install --save-exact next@16.4.6
          npm install --save-dev --save-exact eslint-config-next@16.4.6 vitest@5.1.0 @types/node@24
      - name: Apply compatible transitive security updates
        run: npm audit fix
      - name: Require no high or critical advisories
        run: npm audit --audit-level=high
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Production build
        env:
          AUTH_SECRET: ci-only-not-for-deployment-01234567890123456789
          MONGODB_URI: mongodb://127.0.0.1:27017/dyne_ci
          MONGODB_DB: dyne_ci
          STORAGE_DRIVER: local
        run: npm run build
      - name: Commit verified dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency manifests already current."
          else
            git commit -m "chore: refresh vulnerable dependencies"
            git push origin HEAD:feature/youtube-curation-fast-material-library
          fi
