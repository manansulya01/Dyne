name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run
        env:
          AUTH_SECRET: ci-only-not-for-deployment-01234567890123456789

      - name: Production build
        run: npm run build
        env:
          AUTH_SECRET: ci-only-not-for-deployment-01234567890123456789
          MONGODB_URI: mongodb://127.0.0.1:27017/dyne_ci
          MONGODB_DB: dyne_ci
          STORAGE_DRIVER: local
